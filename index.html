<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>School Attendance System</title>
    <!-- Included Google Fonts & FontAwesome for beautiful typography and icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="login-page">
    <div class="login-container">
        <div class="school-brand">
            <div class="school-logo" style="width: 80px; height: 80px; background: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 16px; font-size: 32px; color: var(--primary); box-shadow: 0 10px 25px rgba(0,0,0,0.2);">
                <i class="fa-solid fa-graduation-cap"></i>
            </div>
            <h1>DAV Public School NTPC Township, Jamthal</h1>
            <p>Smart Attendance Management System</p>
        </div>
        <div class="login-card">
            <div class="login-tabs">
                <button class="login-tab active" onclick="switchLoginTab('admin', this)">Admin</button>
                <button class="login-tab" onclick="switchLoginTab('teacher', this)">Teacher</button>
            </div>
            <form id="adminLoginForm" class="login-form active" onsubmit="handleAdminLogin(event)">
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" class="form-control" id="adminUsername" placeholder="Enter admin username" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" class="form-control" id="adminPassword" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn btn-primary btn-block btn-lg" style="margin-top: 10px;">
                    <i class="fa-solid fa-shield-halved"></i> Sign In as Admin
                </button>
            </form>
            <form id="teacherLoginForm" class="login-form" onsubmit="handleTeacherLogin(event)">
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" class="form-control" id="teacherEmail" placeholder="teacher@springfield.edu" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" class="form-control" id="teacherPassword" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn btn-primary btn-block btn-lg" style="margin-top: 10px;">
                    <i class="fa-solid fa-chalkboard-user"></i> Sign In as Teacher
                </button>
            </form>
        </div>
    </div>
</div>
<script src="js/config.js"></script>
<script src="js/utils.js"></script>
<script>
function switchLoginTab(type, el) {
    var tabs = document.querySelectorAll('.login-tab');
    var forms = document.querySelectorAll('.login-form');
    for (var i=0;i<tabs.length;i++) tabs[i].classList.remove('active');
    for (var j=0;j<forms.length;j++) forms[j].classList.remove('active');
    el.classList.add('active');
    document.getElementById(type+'LoginForm').classList.add('active');
}
function handleAdminLogin(e) {
    e.preventDefault();
    apiCall({action:'adminLogin',username:document.getElementById('adminUsername').value,password:document.getElementById('adminPassword').value}).then(function(r){
        if(r.success){sessionStorage.setItem(CONFIG.ADMIN_SESSION,JSON.stringify(r.data));showToast('Login successful','success');setTimeout(function(){window.location.href='admin.html';},400);}
        else showToast(r.message||'Invalid credentials','error');
    });
}
function handleTeacherLogin(e) {
    e.preventDefault();
    apiCall({action:'teacherLogin',email:document.getElementById('teacherEmail').value,password:document.getElementById('teacherPassword').value}).then(function(r){
        if(r.success){sessionStorage.setItem(CONFIG.TEACHER_SESSION,JSON.stringify(r.data));showToast('Login successful','success');setTimeout(function(){window.location.href='teacher.html';},400);}
        else showToast(r.message||'Invalid credentials','error');
    });
}
if(sessionStorage.getItem(CONFIG.ADMIN_SESSION))window.location.href='admin.html';
else if(sessionStorage.getItem(CONFIG.TEACHER_SESSION))window.location.href='teacher.html';
</script>
</body>
</html>
